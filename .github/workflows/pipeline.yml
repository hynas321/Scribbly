name: Build the Application

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify architecture boundaries
        run: python3 scripts/check_architecture.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ReactApp/package-lock.json

      - name: Install React dependencies
        working-directory: ReactApp
        run: npm ci --legacy-peer-deps

      - name: Build React App
        working-directory: ReactApp
        run: npm run build

      - name: Run frontend tests
        working-directory: ReactApp
        run: npm test -- --run

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore Scribbly.WebApi/Scribbly.sln

      - name: Build backend solution
        run: dotnet build Scribbly.WebApi/Scribbly.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test Scribbly.WebApi.UnitTests/Scribbly.WebApi.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Run integration tests
        run: >-
          dotnet test Scribbly.WebApi.IntegrationTests/Scribbly.WebApi.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
